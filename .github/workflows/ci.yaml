name: verify
on: [push, pull_request]
permissions: {contents: read}
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/secret_scan.py --history
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install uv
      - run: uv sync --extra dev --locked
      - run: uv run --locked --extra dev python scripts/configure.py
      - run: uv run --locked --extra dev python -m company_os.cli init
      - run: uv run --locked --extra dev ruff check apps/api tests scripts
      - run: uv run --locked --extra dev pytest -q
      - run: uv run --locked --extra dev pip-audit
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
        working-directory: apps/web
      - run: npm run format:check && npm run typecheck && npm run build && npm audit --omit=dev
        working-directory: apps/web
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python scripts/configure.py
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: curl --fail http://localhost:8000/health/ready
      - run: docker compose exec -T api python -m alembic check
      - run: docker compose exec -T api python - --allow-test-records < scripts/verify_postgres.py
      - run: npm ci && npx playwright install --with-deps chromium && npm run test:e2e
        working-directory: apps/web
      - run: docker compose logs && docker compose down
        if: always()
